<style>
:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{background:#f1f5f9;font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#0f172a}
.inp{width:100%;border:1px solid #cbd5e1;border-radius:.5rem;padding:.5rem .75rem;background:#fff;font-size:.875rem}
.inp:focus{outline:2px solid #00b8ff;border-color:#00b8ff}
.lbl{display:block;font-size:.7rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:#475569;margin-bottom:.25rem}
.card{background:#fff;border:1px solid #e2e8f0;border-radius:1rem;box-shadow:0 1px 3px rgba(15,23,42,.06)}
.btn{border-radius:.5rem;padding:.5rem 1rem;font-size:.875rem;font-weight:600;transition:.15s}
.btn-p{background:linear-gradient(90deg,#1e7bff,#00c8ff);color:#fff}.btn-p:hover{filter:brightness(1.1)}
.btn-s{background:#e2e8f0;color:#0f172a}.btn-s:hover{background:#cbd5e1}
.tab{padding:.6rem 1rem;font-size:.875rem;font-weight:600;color:#94a3b8;border-bottom:3px solid transparent;white-space:nowrap}
.tab.on{color:#fff;border-color:#00c8ff}
.tbl-wrap{overflow-x:auto}
</style>

<script>

 <div class="flex gap-2 mt-5"><button class="btn btn-p flex-1" onclick="saveCad('${k}')">${editing?'Atualizar':'Cadastrar'}</button>${editing?`<button class="btn btn-s" onclick="go('${k}')">Cancelar</button>`:''}</div></section>
 <section class="card p-5 lg:col-span-2"><h2 class="font-bold text-lg mb-4">${E.t} <span class="text-slate-400 text-sm font-normal">(${S[k].length})</span></h2>
 <div class="tbl-wrap"><table class="w-full text-sm"><thead><tr class="text-left text-xs uppercase text-slate-500 border-b">${E.f.slice(0,E.c).map(f=>`<th class="py-2 pr-3">${f[1]}</th>`).join('')}<th></th></tr></thead><tbody>
 ${S[k].map(x=>`<tr class="border-b last:border-0">${E.f.slice(0,E.c).map(([n,,ty])=>`<td class="py-2 pr-3">${ty==='number'?brl(x[n]):esc(x[n])}</td>`).join('')}<td class="py-2 text-right whitespace-nowrap"><button class="text-blue-600 font-semibold mr-3" onclick="editing='${x.id}';vCad('${k}')">Editar</button><button class="text-red-600 font-semibold" onclick="delCad('${k}','${x.id}')">Excluir</button></td></tr>`).join('')||'<tr><td class="py-8 text-center text-slate-400" colspan="9">Nenhum registro. Use o formulário ao lado.</td></tr>'}
 </tbody></table></div></section></div>`;
}
function saveCad(k){
 const o=editing?S[k].find(x=>x.id===editing):{id:uid()};
 ENT[k].f.forEach(([n,,ty])=>o[n]=ty==='number'?(parseFloat($('#f_'+n).value)||0):$('#f_'+n).value.trim());
 if(!o.nome)return toast('Preencha o nome / descrição.');
 if(!editing)S[k].push(o);
 persist();toast('Salvo com sucesso.');editing=null;vCad(k);
}
function delCad(k,id){if(confirm('Excluir este registro?')){S[k]=S[k].filter(x=>x.id!==id);persist();vCad(k)}}

/* ---------- Proposta ---------- */
function vProposta(){
 $('#main').innerHTML=`<div class="grid lg:grid-cols-3 gap-6">
 <div class="lg:col-span-2 space-y-6">
  <section class="card p-5"><h2 class="font-bold text-lg mb-4">${P.id?'Editando proposta '+esc(P.num):'Dados da proposta'}</h2>
   <div class="grid sm:grid-cols-2 gap-4">
    <div><label class="lbl">Cliente / Empresa</label><select class="inp" onchange="P.cliente=this.value;sum()">${opts(S.clientes,P.cliente,'Selecione o cliente…')}</select>${S.clientes.length?'':'<p class="text-xs text-amber-600 mt-1">Cadastre um cliente na aba Clientes.</p>'}</div>
    <div><label class="lbl">Responsável ByteDigit</label><select class="inp" onchange="P.vendedor=this.value;sum()">${opts(S.vendedores,P.vendedor,'Selecione o vendedor…')}</select>${S.vendedores.length?'':'<p class="text-xs text-amber-600 mt-1">Cadastre um vendedor na aba Vendedores.</p>'}</div>
    <div><label class="lbl">Validade (dias corridos)</label><input type="number" min="1" class="inp" value="${P.validade}" oninput="P.validade=+this.value;sum()"></div>
    <div><label class="lbl">Desconto (%)</label><input type="number" min="0" max="100" step="0.5" class="inp" value="${P.desc}" oninput="P.desc=Math.min(100,Math.max(0,+this.value||0));sum()"></div>
   </div></section>
  <section class="card p-5"><div class="flex justify-between items-center mb-4"><h2 class="font-bold text-lg">Itens e serviços orçados</h2><button class="btn btn-s" onclick="P.itens.push({prod:'',qtd:1,preco:0});vProposta()">+ Adicionar item</button></div>
   <div class="space-y-3">${P.itens.map((it,i)=>`<div class="grid grid-cols-12 gap-2 items-end p-3 rounded-lg bg-slate-50 border">
    <div class="col-span-12 md:col-span-5"><label class="lbl">Item ${i+1}</label><select class="inp" onchange="pickProd(${i},this.value)">${opts(S.produtos,it.prod,'Selecione o serviço…')}</select></div>
    <div class="col-span-4 md:col-span-2"><label class="lbl">Qtd.</label><input type="number" min="0" step="1" class="inp" value="${it.qtd}" oninput="P.itens[${i}].qtd=+this.value;sum()"></div>
    <div class="col-span-8 md:col-span-3"><label class="lbl">Valor unit. (R$)</label><input id="pr${i}" type="number" min="0" step="0.01" class="inp" value="${it.preco}" oninput="P.itens[${i}].preco=+this.value;sum()"></div>
    <div class="col-span-10 md:col-span-1 text-right"><label class="lbl">Total</label><div id="t${i}" class="text-sm font-bold py-2"></div></div>
    <div class="col-span-2 md:col-span-1 text-right"><button class="text-red-600 text-xl" title="Remover" onclick="P.itens.splice(${i},1);if(!P.itens.length)P.itens.push({prod:'',qtd:1,preco:0});vProposta()">✕</button></div></div>`).join('')}</div></section>
  <section class="card p-5 grid sm:grid-cols-2 gap-4"><div><label class="lbl">Condições de pagamento</label><textarea rows="3" class="inp" oninput="P.pag=this.value">${esc(P.pag)}</textarea></div><div><label class="lbl">Observações</label><textarea rows="3" class="inp" oninput="P.obs=this.value">${esc(P.obs)}</textarea></div></section>
 </div>
 <aside class="lg:sticky lg:top-4 h-fit"><div class="card overflow-hidden"><div class="bg-[#050d24] text-white p-5"><p class="text-xs text-cyan-300 uppercase tracking-wider">Resumo da proposta</p><p id="sTot" class="text-3xl font-extrabold mt-1"></p></div>
  <div class="p-5 text-sm space-y-2"><div class="flex justify-between"><span class="text-slate-500">Cliente</span><b id="sCli" class="text-right"></b></div><div class="flex justify-between"><span class="text-slate-500">Vendedor</span><b id="sVen" class="text-right"></b></div><div class="flex justify-between"><span class="text-slate-500">Itens / unidades</span><b id="sQtd"></b></div><div class="flex justify-between"><span class="text-slate-500">Subtotal</span><b id="sSub"></b></div><div class="flex justify-between"><span class="text-slate-500">Desconto</span><b id="sDes" class="text-red-600"></b></div><div class="flex justify-between"><span class="text-slate-500">Validade</span><b id="sVal"></b></div>
  <div class="flex gap-2 pt-3"><button class="btn btn-p flex-1" onclick="saveProp()">Salvar proposta</button><button class="btn btn-s" onclick="P=novaP();vProposta()">Limpar</button></div></div></div></aside></div>`;
 sum();
}
function pickProd(i,id){const p=S.produtos.find(x=>x.id===id);P.itens[i].prod=id;if(p){P.itens[i].preco=p.valor;$('#pr'+i).value=p.valor}sum()}
function calc(){const sub=P.itens.reduce((a,x)=>a+(x.qtd||0)*(x.preco||0),0),d=sub*P.desc/100;return{sub,d,tot:sub-d,un:P.itens.reduce((a,x)=>a+(x.prod?x.qtd||0:0),0),n:P.itens.filter(x=>x.prod).length}}
function sum(){
 if(tab!=='proposta')return;const c=calc();
 P.itens.forEach((x,i)=>{const e=$('#t'+i);if(e)e.textContent=brl((x.qtd||0)*(x.preco||0))});
 const nm=(l,id)=>(l.find(x=>x.id===id)||{}).nome||'—';
 $('#sTot').textContent=brl(c.tot);$('#sSub').textContent=brl(c.sub);$('#sDes').textContent='− '+brl(c.d);
 $('#sQtd').textContent=c.n+' / '+c.un;$('#sVal').textContent=P.validade+' dias';
 $('#sCli').textContent=nm(S.clientes,P.cliente);$('#sVen').textContent=nm(S.vendedores,P.vendedor);
}
function saveProp(){
 const cli=S.clientes.find(x=>x.id===P.cliente),ven=S.vendedores.find(x=>x.id===P.vendedor);
 if(!cli)return toast('Selecione um cliente.');if(!ven)return toast('Selecione um vendedor.');
 const itens=P.itens.filter(x=>x.prod&&x.qtd>0).map(x=>({...x,nome:(S.produtos.find(p=>p.id===x.prod)||{}).nome||'Item removido'}));
 if(!itens.length)return toast('Adicione ao menos um item com quantidade.');
 const c=calc(),rec={...P,itens,cliente:P.cliente,cli:{...cli},ven:{...ven},sub:c.sub,total:c.tot};
 if(P.id){const k=S.propostas.findIndex(x=>x.id===P.id);rec.num=P.num;rec.data=S.propostas[k].data;S.propostas[k]=rec}
 else{rec.id=uid();rec.data=today();rec.num='PROP-'+new Date().getFullYear()+'-'+String(S.propostas.length+1).padStart(3,'0');S.propostas.push(rec)}
 persist();toast('Proposta '+rec.num+' salva.');P=novaP();go('salvas');
}


/* ---------- KPIs da carteira ---------- */
function kpiCli(){
 const L=S.clientes,tot=L.reduce((a,x)=>a+(+x.valor||0),0),men=L.filter(x=>x.contrato==='Plano Mensal').reduce((a,x)=>a+(+x.valor||0),0);
 const seg={};L.forEach(x=>{const g=x.segmento||'Outros';seg[g]=(seg[g]||0)+(+x.valor||0)});
 const mx=Math.max(1,...Object.values(seg));
 return `<div class="grid sm:grid-cols-4 gap-4 mb-6">${[['Clientes ativos',L.length],['Faturamento total base',brl(tot)],['Recorrente (planos mensais)',brl(men)],['Avulso / demanda',brl(tot-men)]].map(([a,b])=>`<div class="card p-4"><p class="text-xs uppercase text-slate-500 font-bold">${a}</p><p class="text-xl font-extrabold text-blue-700">${b}</p></div>`).join('')}</div>
 <div class="card p-5 mb-6"><p class="lbl">Faturamento por segmento</p>${Object.entries(seg).map(([g,v])=>`<div class="flex items-center gap-3 text-sm mb-1"><span class="w-28 shrink-0">${esc(g)}</span><div class="flex-1 bg-slate-100 rounded h-3"><div class="h-3 rounded bg-gradient-to-r from-blue-600 to-cyan-400" style="width:${v/mx*100}%"></div></div><b class="w-24 text-right">${brl(v)}</b></div>`).join('')||'<p class="text-sm text-slate-400">Sem dados.</p>'}</div>`;
}
/* ---------- Fluxo de caixa ---------- */
function vCaixa(){
 const C=S.caixa,inp=(a,j,i,v)=>`<td class="p-1"><input type="number" step="0.01" min="0" class="inp !py-1 text-right min-w-[90px]" value="${v}" oninput="cx('${a}',${j},${i},this.value)"></td>`;
 const tot=(id,c='')=>MES.map((_,i)=>`<td class="p-2 text-right font-bold ${c}" id="${id}${i}"></td>`).join('');
 $('#main').innerHTML=`<div class="grid sm:grid-cols-4 gap-4 mb-6">${[['Total de entradas','kE'],['Total de saídas','kS'],['Resultado do semestre','kR'],['Margem líquida','kM']].map(([a,b])=>`<div class="card p-4"><p class="text-xs uppercase text-slate-500 font-bold">${a}</p><p id="${b}" class="text-xl font-extrabold text-blue-700"></p></div>`).join('')}</div>
 <section class="card p-5 mb-6"><div class="flex flex-wrap justify-between gap-2 mb-4"><h2 class="font-bold text-lg">Fluxo de Caixa Operacional (semestral)</h2><button class="btn btn-s" onclick="syncRec()">Sincronizar recorrente com a carteira</button></div>
 <div class="tbl-wrap"><table class="w-full text-sm"><thead><tr class="text-left text-xs uppercase text-slate-500 border-b"><th class="py-2 pr-3">Categoria / item</th>${MES.map(m=>`<th class="text-right px-2">${m}</th>`).join('')}</tr></thead><tbody>
 <tr class="bg-blue-50"><td colspan="7" class="p-2 font-bold text-blue-800">1. ENTRADAS (RECEITAS)</td></tr>
 <tr><td class="pr-3">Contratos recorrentes mensais (BPO)</td>${C.rec.map((v,i)=>inp('rec',-1,i,v)).join('')}</tr>
 <tr><td class="pr-3">Serviços por demanda (avulsos)</td>${C.avu.map((v,i)=>inp('avu',-1,i,v)).join('')}</tr>
 <tr class="border-t"><td class="p-2 font-bold">TOTAL DE ENTRADAS</td>${tot('te','text-green-700')}</tr>
 <tr class="bg-blue-50"><td colspan="7" class="p-2 font-bold text-blue-800">2. SAÍDAS (CUSTOS E DESPESAS)</td></tr>
 ${C.sai.map((r,j)=>`<tr><td class="pr-3">${esc(r.nome)}</td>${r.v.map((v,i)=>inp('sai',j,i,v)).join('')}</tr>`).join('')}
 <tr class="border-t"><td class="p-2 font-bold">TOTAL DE SAÍDAS</td>${tot('ts','text-red-600')}</tr>
 <tr class="bg-blue-50"><td colspan="7" class="p-2 font-bold text-blue-800">3. INDICADORES LÍQUIDOS</td></tr>
 <tr><td class="p-2 font-bold">SALDO OPERACIONAL DO MÊS</td>${tot('sd')}</tr>
 <tr><td class="p-2 font-bold">SALDO ACUMULADO EM CAIXA</td>${tot('ac','text-blue-700')}</tr></tbody></table></div></section>
 <section class="card p-5"><p class="lbl">Saldo acumulado em caixa</p><div class="flex items-end gap-3 h-40">${MES.map((m,i)=>`<div class="flex-1 flex flex-col justify-end h-full text-center"><span id="bl${i}" class="text-[11px] font-bold mb-1"></span><div id="bar${i}" class="rounded-t bg-gradient-to-t from-blue-600 to-cyan-400" style="height:0"></div><span class="text-xs text-slate-500 mt-1">${m.slice(0,3)}</span></div>`).join('')}</div></section>`;
 cxCalc();
}
function cx(a,j,i,v){const n=+v||0;if(a==='sai')S.caixa.sai[j].v[i]=n;else S.caixa[a][i]=n;persist();cxCalc()}
function cxCalc(){
 const C=S.caixa;let ac=0,E=0,Sd=0;const acs=[];
 MES.forEach((_,i)=>{const e=C.rec[i]+C.avu[i],s=C.sai.reduce((a,r)=>a+r.v[i],0);ac+=e-s;E+=e;Sd+=s;acs.push(ac);
  $('#te'+i).textContent=brl(e);$('#ts'+i).textContent=brl(s);const d=$('#sd'+i);d.textContent=brl(e-s);d.className='p-2 text-right font-bold '+(e-s<0?'text-red-600':'text-green-700');$('#ac'+i).textContent=brl(ac)});
 const mx=Math.max(1,...acs.map(Math.abs));
 acs.forEach((v,i)=>{$('#bar'+i).style.height=Math.abs(v)/mx*100+'%';$('#bl'+i).textContent=brl(v).replace(/\s/g,' ')});
 $('#kE').textContent=brl(E);$('#kS').textContent=brl(Sd);$('#kR').textContent=brl(E-Sd);$('#kM').textContent=(E?(E-Sd)/E*100:0).toFixed(1).replace('.',',')+'%';
}
function syncRec(){const m=S.clientes.filter(x=>x.contrato==='Plano Mensal').reduce((a,x)=>a+(+x.valor||0),0);S.caixa.rec=f6(m);persist();vCaixa();toast('Recorrente atualizado: '+brl(m)+'/mês')}

/* ---------- Propostas salvas ---------- */
function vSalvas(){
 const tot=S.propostas.reduce((a,x)=>a+x.total,0);
 $('#main').innerHTML=`<div class="grid sm:grid-cols-3 gap-4 mb-6">${[['Propostas',S.propostas.length],['Valor total emitido',brl(tot)],['Ticket médio',brl(S.propostas.length?tot/S.propostas.length:0)]].map(([a,b])=>`<div class="card p-5"><p class="text-xs uppercase text-slate-500 font-bold">${a}</p><p class="text-2xl font-extrabold text-blue-700">${b}</p></div>`).join('')}</div>
 <section class="card p-5"><div class="flex flex-wrap justify-between gap-2 mb-4"><h2 class="font-bold text-lg">Propostas emitidas</h2><button class="btn btn-s" onclick="exportCSV()">Exportar planilha (CSV)</button></div>
 <div class="tbl-wrap"><table class="w-full text-sm"><thead><tr class="text-left text-xs uppercase text-slate-500 border-b"><th class="py-2 pr-3">Nº</th><th class="pr-3">Data</th><th class="pr-3">Cliente</th><th class="pr-3">Vendedor</th><th class="pr-3 text-right">Total</th><th></th></tr></thead><tbody>
 ${S.propostas.slice().reverse().map(x=>`<tr class="border-b last:border-0"><td class="py-2 pr-3 font-semibold">${esc(x.num)}</td><td class="pr-3">${fmtD(x.data)}</td><td class="pr-3">${esc(x.cli.nome)}</td><td class="pr-3">${esc(x.ven.nome)}</td><td class="pr-3 text-right font-bold">${brl(x.total)}</td><td class="text-right whitespace-nowrap"><button class="text-blue-600 font-semibold mr-3" onclick="openProp('${x.id}')">Abrir</button><button class="text-red-600 font-semibold" onclick="delProp('${x.id}')">Excluir</button></td></tr>`).join('')||'<tr><td colspan="6" class="py-8 text-center text-slate-400">Nenhuma proposta salva ainda.</td></tr>'}
 </tbody></table></div></section>`;
}
function openProp(id){const x=S.propostas.find(p=>p.id===id);P=JSON.parse(JSON.stringify(x));tab='proposta';render()}
function delProp(id){if(confirm('Excluir esta proposta?')){S.propostas=S.propostas.filter(x=>x.id!==id);persist();vSalvas()}}

/* ---------- Exportar / Importar ---------- */
async function salvarArquivo(nome,texto,mime){
 let dl=null;try{dl=window.claude&&await window.claude.use('downloads')}catch(e){}
 const blob=new Blob([texto],{type:mime});
 if(dl){try{await dl.save({filename:nome,data:blob});toast('Arquivo pronto: '+nome)}catch(e){toast(e&&e.code==='declined'?'Download cancelado.':'Não foi possível salvar o arquivo.')}return}
 const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=nome;document.body.appendChild(a);a.click();a.remove();toast('Arquivo salvo: '+nome);
}
function exportar(){salvarArquivo('bytedigit_dados_'+today()+'.json',JSON.stringify({app:'ByteDigit',exportadoEm:new Date().toISOString(),...S},null,2),'application/json')}
function exportCSV(){
 const L=[['Nº','Data','Cliente','CNPJ/CPF','Vendedor','Item','Qtd','Valor unit.','Total item','Desconto %','Total proposta']];
 S.propostas.forEach(p=>p.itens.forEach(i=>L.push([p.num,fmtD(p.data),p.cli.nome,p.cli.doc,p.ven.nome,i.nome,i.qtd,i.preco,(i.qtd*i.preco).toFixed(2),p.desc,p.total.toFixed(2)])));
 salvarArquivo('bytedigit_propostas_'+today()+'.csv','\ufeff'+L.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(';')).join('\n'),'text/csv');
}
$('#imp').addEventListener('change',e=>{
 const f=e.target.files[0];if(!f)return;const r=new FileReader();
 r.onload=()=>{try{const d=JSON.parse(r.result);['clientes','produtos','vendedores','propostas'].forEach(k=>{if(Array.isArray(d[k]))S[k]=d[k]});if(d.caixa&&d.caixa.rec)S.caixa=d.caixa;persist();toast('Dados importados.');render()}catch(x){toast('Arquivo inválido.')}};
 r.readAsText(f);e.target.value='';
});
render();
</script>
